<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProteinGo</title>
    
    <!-- PWA 關鍵連結 -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        :root {
            --bg-color: #f4f6f0;      
            --card-bg: #ffffff;       
            --dark-card: #1a1a1c;     
            --lime: #cbfb45;          /* 蘋果綠 / 萊姆綠 */
            --lime-hover: #bcf226;
            --text-dark: #111111;     
            --text-light: #ffffff;    
            --text-muted: #888888;
            --border-radius-lg: 24px;
            --border-radius-md: 16px;
            --border-radius-sm: 12px;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; padding: 20px; margin: 0; color: var(--text-dark); }
        .container { background: var(--card-bg); padding: 30px; border-radius: var(--border-radius-lg); box-shadow: 0 10px 30px rgba(0,0,0,0.04); width: 100%; max-width: 400px; border: 1px solid #eef0e8;}
        
        .header { text-align: center; margin-bottom: 25px; }
        h1 { font-size: 24px; margin: 0 0 8px 0; font-weight: 800; letter-spacing: -0.5px;}
        .date { background: var(--lime); color: var(--text-dark); font-size: 13px; font-weight: bold; display: inline-block; padding: 6px 16px; border-radius: 20px; }

        /* SVG 圖示全域設定 */
        .icon { display: inline-block; width: 1.2em; height: 1.2em; vertical-align: middle; fill: currentColor; }

        .progress-section { text-align: center; margin: 25px 0; padding: 25px 20px; background: var(--dark-card); border-radius: var(--border-radius-lg); position: relative; color: var(--text-light); box-shadow: 0 8px 20px rgba(26,26,28,0.15);}
        .target-text { font-size: 14px; color: #aaaaaa; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 5px;}
        
        /* 獎盃圖示設為蘋果綠 */
        .target-text .icon { color: var(--lime); width: 1.4em; height: 1.4em; }
        
        .target-input { width: 60px; text-align: center; border: none; border-bottom: 2px solid #444; background: transparent; font-weight: bold; color: var(--text-light); font-size: 16px; outline: none; transition: 0.3s; padding: 2px;}
        .target-input:focus { border-bottom-color: var(--lime); color: var(--lime);}

        .total-protein { font-size: 48px; font-weight: 800; color: var(--text-light); margin: 5px 0 10px 0; transition: color 0.3s; letter-spacing: -1px;}
        .total-protein.achieved { color: var(--lime); }
        .unit { font-size: 16px; color: #888; font-weight: normal; }
        
        .progress-bar-bg { width: 100%; height: 14px; background: #333333; border-radius: 10px; overflow: hidden; margin-top: 15px; }
        .progress-bar-fill { height: 100%; background: var(--lime); width: 0%; transition: width 0.5s ease-out, background-color 0.3s; border-radius: 10px;}
        .progress-bar-fill.achieved { background: var(--lime); box-shadow: 0 0 10px rgba(203, 251, 69, 0.4); }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .section-header h2 { font-size: 17px; font-weight: 800; margin: 0; letter-spacing: -0.3px;}
        
        /* 編輯按鈕設計 */
        .edit-btn { background: none; border: none; font-size: 14px; cursor: pointer; padding: 0; transition: 0.3s; display: flex; align-items: center; gap: 4px; font-weight: bold;}
        /* 游標圖示設為蘋果綠 */
        .edit-btn .icon { color: var(--lime); width: 1.3em; height: 1.3em;}
        .edit-btn:hover { opacity: 0.8; }
        
        .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .quick-btn-wrapper { position: relative; }
        .quick-btn { width: 100%; height: 100%; background: #f8f9f5; color: var(--text-dark); border: 1px solid #ebece6; padding: 15px 10px; border-radius: var(--border-radius-md); cursor: pointer; text-align: center; line-height: 1.4; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center;}
        .quick-btn:hover { background: #f0f4e3; border-color: #dbe4c7; }
        .quick-btn:active { transform: scale(0.97); }
        .quick-btn-name { font-size: 15px; font-weight: bold; color: var(--text-dark); }
        .quick-btn-desc { font-size: 12px; font-weight: normal; margin-top: 4px; color: var(--text-muted); }
        
        .delete-icon { display: none; position: absolute; top: -8px; right: -8px; background: #ff4d4d; color: white; border-radius: 50%; width: 26px; height: 26px; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);}
        .delete-icon .icon { width: 14px; height: 14px; }
        .edit-mode .delete-icon { display: flex; }
        .edit-mode .quick-btn { pointer-events: none; opacity: 0.7; }
        .add-quick-btn { background: #fff; border: 2px dashed #ccc; color: #888; border-radius: var(--border-radius-md); font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 15px 10px; transition: 0.2s; gap: 5px;}
        .add-quick-btn:hover { background: #fafafa; color: var(--text-dark); border-color: var(--text-dark);}

        .custom-key-form { display: none; flex-direction: column; gap: 10px; background: #f8f9f5; border: 1px solid #ebece6; padding: 15px; border-radius: var(--border-radius-md); margin-bottom: 20px; }
        .custom-key-form.active { display: flex; }
        .form-row { display: flex; gap: 10px; }
        .form-row input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: var(--border-radius-sm); font-size: 14px; outline: none;}
        .form-row input:focus { border-color: var(--text-dark); }
        .action-row { display: flex; gap: 10px; justify-content: flex-end;}
        .save-btn { background: var(--text-dark); color: white; border: none; padding: 10px 18px; border-radius: var(--border-radius-sm); cursor: pointer; font-weight: bold;}
        .cancel-btn { background: #e0e0e0; color: var(--text-dark); border: none; padding: 10px 18px; border-radius: var(--border-radius-sm); cursor: pointer; font-weight: bold;}

        .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
        input.manual-input { flex: 1; padding: 15px; border: 1px solid #e0e0e0; background: #fcfcfc; border-radius: var(--border-radius-sm); font-size: 15px; outline: none; transition: border 0.3s;}
        input.manual-input:focus { border-color: var(--text-dark); background: #fff;}
        .estimate-msg { font-size: 13px; color: #6a9c27; min-height: 18px; font-weight: bold; padding-left: 5px; display: flex; align-items: center; gap: 4px;}
        
        .btn-add { background: var(--lime); color: var(--text-dark); border: none; padding: 16px; border-radius: var(--border-radius-lg); font-size: 16px; cursor: pointer; font-weight: 800; transition: 0.2s; box-shadow: 0 4px 10px rgba(203, 251, 69, 0.2);}
        .btn-add:hover { background: var(--lime-hover); transform: translateY(-2px);}
        .btn-add:active { transform: translateY(0); }
        .btn-add.achieved { background: var(--dark-card); color: var(--lime); box-shadow: 0 4px 10px rgba(26,26,28, 0.2);}

        .history-list { list-style: none; padding: 0; margin: 0 0 30px 0; max-height: 150px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; padding: 12px 5px; border-bottom: 1px solid #f0f0f0; font-size: 15px; align-items: center;}
        .history-item span:last-child { font-weight: 800; font-size: 16px; }

        .suggestions { background: #f8fcf2; padding: 18px; border-radius: var(--border-radius-md); margin-bottom: 30px; font-size: 14px; line-height: 1.6; border: 1px solid #e8f4d8;}
        .suggestions h3 { margin: 0 0 10px 0; font-size: 15px; color: #5a7d2a; font-weight: 800; display: flex; align-items: center; gap: 6px;}
        .suggestions ul { margin: 0; padding-left: 20px; color: #444; }

        .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .nav-btn { background: #f0f0f0; border: none; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; color: var(--text-dark); transition: 0.2s; font-weight: bold;}
        .nav-btn .icon { width: 14px; height: 14px; }
        .nav-btn:hover { background: var(--lime); }
        .calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 10px; text-align: center; }
        .cal-weekday { font-size: 12px; font-weight: bold; color: var(--text-muted); }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: var(--border-radius-sm); background: #f6f6f6; color: var(--text-muted); box-sizing: border-box; cursor: pointer; transition: 0.2s;}
        .cal-day:hover { transform: scale(1.05); }
        .cal-day-num { font-size: 14px; font-weight: 800;}
        .cal-day-total { font-size: 10px; margin-top: 2px; font-weight: 600;}
        
        .cal-day.empty { background: transparent; color: transparent; box-shadow: none; pointer-events: none; }
        .cal-day.has-data { background: #eef7d9; color: var(--text-dark); }
        .cal-day.goal-reached { background: var(--dark-card); color: var(--lime); box-shadow: 0 2px 8px rgba(26,26,28,0.2); }
        .cal-day.today { border: 2px solid var(--lime); color: var(--text-dark); }
        .cal-day.goal-reached.today { border: 2px solid var(--lime); }
        .cal-day.selected { box-shadow: 0 0 0 2px var(--text-dark); transform: scale(1.05);}

        .reset-btn { background: transparent; color: var(--text-dark); border: 2px solid #e0e0e0; width: 100%; margin-top: 10px; padding: 14px; border-radius: var(--border-radius-lg); cursor: pointer; font-weight: 800; font-size: 15px; transition: 0.2s;}
        .reset-btn:hover { background: #ffe6e6; border-color: #ffb3b3; color: #d90000;}
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>ProteinGo</h1>
        <div class="date" id="selectedDateLabel"></div>
    </div>

    <div class="progress-section">
        <div class="target-text">
            Goal 
            <!-- Solid Trophy SVG -->
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M19 4h-2V3a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v1H5a2 2 0 0 0-2 2v2c0 2.2 1.8 4 4 4h.4a6.6 6.6 0 0 0 3.6 4.6V19H8a1 1 0 0 0 0 2h8a1 1 0 0 0 0-2h-3v-1.4a6.6 6.6 0 0 0 3.6-4.6h.4c2.2 0 4-1.8 4-4V6a2 2 0 0 0-2-2zM7 10H5V6h2v4zm12 0h-2V6h2v4z"/>
            </svg>
            <input type="number" id="userTarget" class="target-input" step="0.1" min="1" onchange="saveTarget()"> g
        </div>
        <div class="total-protein" id="totalProteinContainer"><span id="totalDisplay">0</span> <span class="unit" id="unitDisplay">g</span></div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <div class="section-header">
        <h2>Quick Actions</h2>
        <!-- 編輯按鈕 (替換為參考圖的實心游標) -->
        <button class="edit-btn" onclick="toggleEditMode()" id="editModeBtn">
            <!-- Solid Cursor Pointer SVG -->
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M6.3 2.1a1.5 1.5 0 0 0-2.2 1.3v17.2a1.5 1.5 0 0 0 2.5 1.1l4.4-4.2 3 7.1a1.5 1.5 0 0 0 2.8-1.2l-3.1-7.1 6-.5a1.5 1.5 0 0 0 .8-2.6L6.3 2.1z"/>
            </svg> 
            <span id="editBtnText" style="color:var(--text-muted);">編輯</span>
        </button>
    </div>
    
    <div class="quick-actions" id="quickActionsContainer"></div>

    <div class="custom-key-form" id="customKeyForm">
        <div style="font-size: 13px; color: var(--text-dark); font-weight: bold;">新增自訂快捷鍵</div>
        <div class="form-row">
            <input type="text" id="newKeyName" placeholder="名稱 (例: 蛋白棒)">
            <input type="number" id="newKeyAmount" placeholder="含量(g)" step="0.1" style="width: 80px; flex: none;">
        </div>
        <div class="action-row">
            <button class="cancel-btn" onclick="toggleAddForm()">取消</button>
            <button class="save-btn" onclick="saveCustomKey()">儲存</button>
        </div>
    </div>

    <div class="input-group">
        <input type="text" id="foodInput" class="manual-input" placeholder="輸入食材與份量 (如: 堅果 5g)">
        <div class="estimate-msg" id="estimateMsg"></div>
        <input type="number" id="proteinInput" class="manual-input" placeholder="蛋白質含量 (g)" step="0.1">
        <button class="btn-add" id="btnAdd" onclick="addRecord()">Add Record →</button>
    </div>

    <div class="section-header">
        <h2 id="historyTitle">Activity</h2>
    </div>
    <ul class="history-list" id="historyList"></ul>

    <div class="suggestions">
        <h3 id="suggestionTitle">
            <svg class="icon" viewBox="0 0 24 24" style="color:var(--lime); width: 1.2em; height: 1.2em;">
                <path d="M12 2.3l2.8 5.7 6.3.9-4.5 4.4 1 6.3-5.6-3-5.6 3 1-6.3-4.5-4.4 6.3-.9L12 2.3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            蛋白質推薦 (5項)
        </h3>
        <ul id="suggestionList"></ul>
    </div>

    <div class="calendar-section">
        <div class="calendar-nav">
            <button class="nav-btn" onclick="changeMonth(-1)">
                <!-- Chevron Left -->
                <svg class="icon" viewBox="0 0 24 24"><path d="M14.7 18.3a1.5 1.5 0 0 1-2.1 2.1l-7.5-7.5c-.6-.6-.6-1.5 0-2.1l7.5-7.5a1.5 1.5 0 0 1 2.1 2.1L8.3 12l6.4 6.3z"/></svg>
            </button>
            <h2 id="monthLabel" style="margin:0; font-size: 17px; font-weight:800;"></h2>
            <button class="nav-btn" onclick="changeMonth(1)">
                <!-- Chevron Right -->
                <svg class="icon" viewBox="0 0 24 24"><path d="M9.3 18.3a1.5 1.5 0 0 0 2.1 2.1l7.5-7.5c.6-.6.6-1.5 0-2.1l-7.5-7.5a1.5 1.5 0 0 0-2.1 2.1L15.7 12l-6.4 6.3z"/></svg>
            </button>
        </div>
        
        <div class="calendar-header">
            <div class="cal-weekday">MON</div>
            <div class="cal-weekday">TUE</div>
            <div class="cal-weekday">WED</div>
            <div class="cal-weekday">THU</div>
            <div class="cal-weekday">FRI</div>
            <div class="cal-weekday">SAT</div>
            <div class="cal-weekday">SUN</div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <button class="reset-btn" id="resetBtn" onclick="resetSelectedData()">Reset This Day</button>
</div>

<script>
    function getLocalDateString(date) {
        const d = new Date(date);
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    const today = new Date();
    const todayKey = getLocalDateString(today);
    
    let selectedDateStr = todayKey;
    let currentCalendarMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    
    let currentTarget = parseFloat(localStorage.getItem('proteinTargetValue')) || 79.5;
    document.getElementById('userTarget').value = currentTarget;

    const foodDatabase = {
        "堅果": 15, "綜合堅果": 15, "核桃": 15, "杏仁": 21, "腰果": 18,
        "雞胸肉": 23, "雞肉": 20, "牛肉": 20, "牛排": 20, "豬肉": 20, "豬里肌": 20, "鮭魚": 20, "鮪魚": 25, "魚肉": 20,
        "蝦": 18, "鮮蚵": 9, "蛤蜊": 10, "雞蛋": 13, "茶葉蛋": 13, 
        "鮮奶": 3.3, "牛奶": 3.3, "豆漿": 3.3, "燕麥奶": 1,
        "板豆腐": 8.5, "嫩豆腐": 5, "豆干": 19,
        "毛豆": 13, "高麗菜": 1.3, "花椰菜": 3, "白飯": 2.6, "糙米": 3, "燕麥": 13,
        "義美豌豆蛋白粉": 79.2, "光泉鮮奶優酪": 3.4
    };

    const defaultQuickKeys = [
        { name: "雞胸肉", amount: 23, desc: "100g" },
        { name: "義美蛋白粉", amount: 19.8, desc: "25g" },
        { name: "板豆腐", amount: 8.5, desc: "100g" },
        { name: "茶葉蛋", amount: 7, desc: "1顆" },
        { name: "豆漿", amount: 3.3, desc: "100ml" },
        { name: "光泉優酪", amount: 3.4, desc: "100g" }
    ];

    let quickKeys = JSON.parse(localStorage.getItem('proteinQuickKeys_v3')) || defaultQuickKeys;
    let isEditMode = false;

    // SVG 常數宣告 (更新為 Cursor Pointer)
    const svgPointer = `<svg class="icon" viewBox="0 0 24 24"><path d="M6.3 2.1a1.5 1.5 0 0 0-2.2 1.3v17.2a1.5 1.5 0 0 0 2.5 1.1l4.4-4.2 3 7.1a1.5 1.5 0 0 0 2.8-1.2l-3.1-7.1 6-.5a1.5 1.5 0 0 0 .8-2.6L6.3 2.1z"/></svg>`;
    const svgCheck = `<svg class="icon" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12a1.5 1.5 0 0 0-2.1 2.1l5.3 5.3c.6.6 1.5.6 2.1 0l11.3-11.3a1.5 1.5 0 0 0-2.1-2.1L9 16.2z"/></svg>`;
    const svgTrash = `<svg class="icon" viewBox="0 0 24 24"><path d="M19 6h-3V4c0-1.1-.9-2-2-2h-4C8.9 2 8 2.9 8 4v2H5C4.4 6 4 6.4 4 7s.4 1 1 1v11c0 1.6 1.3 3 3 3h8c1.6 0 3-1.4 3-3V8c.6 0 1-.4 1-1s-.4-1-1-1zM10 4h4v2h-4V4z"/></svg>`;
    const svgPlus = `<svg class="icon" viewBox="0 0 24 24"><path d="M19 10.5h-5.5V5a1.5 1.5 0 0 0-3 0v5.5H5a1.5 1.5 0 0 0 0 3h5.5V19a1.5 1.5 0 0 0 3 0v-5.5H19a1.5 1.5 0 0 0 0-3z"/></svg>`;
    const svgSparkle = `<svg class="icon" viewBox="0 0 24 24" style="width:14px; height:14px;"><path d="M12 2.3l2.8 5.7 6.3.9-4.5 4.4 1 6.3-5.6-3-5.6 3 1-6.3-4.5-4.4 6.3-.9L12 2.3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>`;

    function renderQuickKeys() {
        const container = document.getElementById('quickActionsContainer');
        container.innerHTML = '';
        quickKeys.forEach((key, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'quick-btn-wrapper';
            const descHtml = key.desc ? `<div class="quick-btn-desc">(${key.desc}: ${key.amount}g)</div>` : `<div class="quick-btn-desc">(${key.amount}g)</div>`;
            wrapper.innerHTML = `
                <button class="quick-btn" onclick="handleQuickClick(${index})">
                    <div class="quick-btn-name">${key.name}</div>
                    ${descHtml}
                </button>
                <div class="delete-icon" onclick="deleteQuickKey(${index})">
                    ${svgTrash}
                </div>
            `;
            container.appendChild(wrapper);
        });
        
        if (isEditMode) {
            container.classList.add('edit-mode');
            const addBtn = document.createElement('button');
            addBtn.className = 'add-quick-btn';
            addBtn.innerHTML = `${svgPlus} Add New`;
            addBtn.onclick = toggleAddForm;
            container.appendChild(addBtn);
        } else {
            container.classList.remove('edit-mode');
        }
    }

    function handleQuickClick(index) {
        if (isEditMode) return; 
        const key = quickKeys[index];
        const recordName = key.desc ? `${key.name}(${key.desc})` : key.name;
        addQuickRecord(recordName, key.amount);
    }
    
    function toggleEditMode() {
        isEditMode = !isEditMode;
        const btn = document.getElementById('editModeBtn');
        
        if (isEditMode) {
            btn.innerHTML = `${svgCheck} <span id="editBtnText" style="color:var(--text-dark);">儲存</span>`; 
        } else {
            btn.innerHTML = `${svgPointer} <span id="editBtnText" style="color:var(--text-muted);">編輯</span>`; 
            document.getElementById('customKeyForm').classList.remove('active');
        }
        renderQuickKeys();
    }
    
    function toggleAddForm() { document.getElementById('customKeyForm').classList.toggle('active'); }
    
    function saveCustomKey() {
        const name = document.getElementById('newKeyName').value.trim();
        const amount = parseFloat(document.getElementById('newKeyAmount').value);
        if (name && amount > 0) {
            quickKeys.push({ name: name, amount: amount, desc: "" }); 
            localStorage.setItem('proteinQuickKeys_v3', JSON.stringify(quickKeys));
            document.getElementById('newKeyName').value = ''; document.getElementById('newKeyAmount').value = '';
            document.getElementById('customKeyForm').classList.remove('active'); renderQuickKeys();
        } else { alert('請完整輸入名稱與蛋白質含量！'); }
    }
    
    function deleteQuickKey(index) {
        if (confirm(`確定要刪除「${quickKeys[index].name}」的快捷鍵嗎？`)) {
            quickKeys.splice(index, 1); localStorage.setItem('proteinQuickKeys_v3', JSON.stringify(quickKeys)); renderQuickKeys();
        }
    }

    let appData = JSON.parse(localStorage.getItem('proteinAppData_v5')) || {};
    if (!appData[selectedDateStr]) appData[selectedDateStr] = [];

    const dailySuggestions = [
        ["鮮蚵/海鮮：9g/100g", "毛豆：13g/100g", "低脂牛奶：3g/100ml", "南瓜子：8g/30g", "綜合堅果：5g/份"], 
        ["水煮雞胸肉：23g/塊", "光泉優酪：3.4g/100g", "全麥吐司：4g/片", "溏心蛋：6.5g/顆", "酪梨：2g/顆"], 
        ["茶葉蛋：7g/顆", "板豆腐：8.5g/100g", "鮪魚沙拉：15g/份", "無糖豆漿：3.3g/100ml", "毛豆莢：10g/盤"], 
        ["低脂牛肉：20g/100g", "豆干：19g/100g", "腰果：5g/一把", "燕麥奶：2g/200ml", "烤鯖魚：18g/份"], 
        ["鮭魚菲力：20g/100g", "水煮蛋：6g/顆", "義美蛋白粉：19.8g/25g", "蝦仁：18g/100g", "鷹嘴豆：15g/100g"], 
        ["豬里肌：20g/100g", "黑豆水：1g/瓶", "雞丸子：12g/份", "起司片：5g/片", "花生醬：4g/勺"], 
        ["拿鐵(大杯)：10g/杯", "涮涮鍋(瘦肉)：25g/盤", "滷牛腱：22g/100g", "鯛魚片：18g/100g", "杏仁：6g/一把"] 
    ];

    function renderSuggestions() {
        const selDateObj = new Date(selectedDateStr);
        const list = document.getElementById('suggestionList');
        list.innerHTML = dailySuggestions[selDateObj.getDay()].map(item => `<li>${item}</li>`).join('');
    }

    function saveTarget() {
        const inputVal = parseFloat(document.getElementById('userTarget').value);
        if (!isNaN(inputVal) && inputVal > 0) {
            currentTarget = inputVal;
            localStorage.setItem('proteinTargetValue', currentTarget);
            updateDisplay(); 
        } else {
            document.getElementById('userTarget').value = currentTarget;
        }
    }

    function selectDate(dateStr) {
        selectedDateStr = dateStr;
        if (!appData[selectedDateStr]) appData[selectedDateStr] = [];
        updateDisplay();
    }

    function updateDisplay() {
        const selDateObj = new Date(selectedDateStr);
        
        let dateLabel = selDateObj.toLocaleDateString('zh-TW', { month: 'long', day: 'numeric' });
        if (selectedDateStr === todayKey) dateLabel = "Today, " + dateLabel;
        document.getElementById('selectedDateLabel').innerText = dateLabel;

        document.getElementById('historyTitle').innerText = (selectedDateStr === todayKey) ? "Recent Activity" : `${selDateObj.getMonth()+1}/${selDateObj.getDate()} Activity`;

        const dayRecords = appData[selectedDateStr];
        const totalProtein = dayRecords.reduce((sum, record) => sum + record.amount, 0);
        document.getElementById('totalDisplay').innerText = totalProtein.toFixed(1);
        
        let progressPercent = (totalProtein / currentTarget) * 100;
        document.getElementById('progressBar').style.width = Math.min(progressPercent, 100) + '%';

        const isAchieved = totalProtein >= currentTarget;
        document.getElementById('totalProteinContainer').classList.toggle('achieved', isAchieved);
        document.getElementById('progressBar').classList.toggle('achieved', isAchieved);
        document.getElementById('btnAdd').classList.toggle('achieved', isAchieved);
        document.getElementById('unitDisplay').style.color = isAchieved ? "var(--lime)" : "#888";

        localStorage.setItem('proteinAppData_v5', JSON.stringify(appData));
        renderHistory();
        renderCalendar();
        renderSuggestions();
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        list.innerHTML = appData[selectedDateStr].length ? 
            appData[selectedDateStr].map(r => `<li class="history-item"><span>${r.name}</span><span>+${r.amount}g</span></li>`).join('') :
            '<li style="text-align:center; color:var(--text-muted); font-size:14px; padding:15px;">No records yet</li>';
    }

    function changeMonth(offset) {
        currentCalendarMonth.setMonth(currentCalendarMonth.getMonth() + offset);
        renderCalendar();
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        
        const year = currentCalendarMonth.getFullYear();
        const month = currentCalendarMonth.getMonth();
        
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        document.getElementById('monthLabel').innerText = `${monthNames[month]} ${year}`;

        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();
        const offset = firstDay === 0 ? 6 : firstDay - 1;

        for (let i = 0; i < offset; i++) {
            const blankDiv = document.createElement('div');
            blankDiv.className = 'cal-day empty';
            grid.appendChild(blankDiv);
        }

        for (let i = 1; i <= daysInMonth; i++) {
            const dateStr = getLocalDateString(new Date(year, month, i));
            const dayDiv = document.createElement('div');
            dayDiv.className = 'cal-day';
            
            dayDiv.onclick = () => selectDate(dateStr);

            let contentHtml = `<div class="cal-day-num">${i}</div>`;

            if (appData[dateStr]) {
                const dayTotal = appData[dateStr].reduce((sum, r) => sum + r.amount, 0);
                if (dayTotal >= currentTarget) dayDiv.classList.add('goal-reached');
                else if (dayTotal > 0) dayDiv.classList.add('has-data');
                
                if (dayTotal > 0) {
                    contentHtml += `<div class="cal-day-total">${dayTotal.toFixed(1)}</div>`;
                }
            }

            if (dateStr === todayKey) dayDiv.classList.add('today');
            if (dateStr === selectedDateStr) dayDiv.classList.add('selected');

            dayDiv.innerHTML = contentHtml;
            grid.appendChild(dayDiv);
        }
    }

    document.getElementById('foodInput').addEventListener('input', function() {
        const inputStr = this.value;
        const msgBox = document.getElementById('estimateMsg');
        const proteinBox = document.getElementById('proteinInput');
        
        const amountMatch = inputStr.match(/(\d+(\.\d+)?)\s*(g|克|ml|毫升)/i);
        let weight = 0;
        if (amountMatch) { weight = parseFloat(amountMatch[1]); }

        let foundFood = null;
        for (let food in foodDatabase) {
            if (inputStr.includes(food)) {
                if (!foundFood || food.length > foundFood.length) { foundFood = food; }
            }
        }

        if (foundFood && weight > 0) {
            const proteinPer100g = foodDatabase[foundFood];
            const estimatedProtein = (weight / 100) * proteinPer100g;
            proteinBox.value = estimatedProtein.toFixed(1);
            msgBox.innerHTML = `${svgSparkle} 偵測到「${foundFood}」${weight}${amountMatch[3]}，約含 ${estimatedProtein.toFixed(1)}g 蛋白質`;
        } else { msgBox.innerHTML = ''; }
    });

    function addRecord() {
        const name = document.getElementById('foodInput').value || 'Unknown';
        const amount = parseFloat(document.getElementById('proteinInput').value);
        if (amount > 0) {
            appData[selectedDateStr].push({ name, amount });
            updateDisplay();
            document.getElementById('foodInput').value = '';
            document.getElementById('proteinInput').value = '';
            document.getElementById('estimateMsg').innerHTML = ''; 
        }
    }

    function addQuickRecord(name, amount) {
        appData[selectedDateStr].push({ name, amount });
        updateDisplay();
    }

    function resetSelectedData() {
        const dateObj = new Date(selectedDateStr);
        const label = selectedDateStr === todayKey ? "Today" : `${dateObj.getMonth()+1}/${dateObj.getDate()}`;
        if(confirm(`確定要清空 ${label} 的紀錄嗎？`)) { 
            appData[selectedDateStr] = []; 
            updateDisplay(); 
        }
    }

    // 初始載入
    renderQuickKeys();
    updateDisplay();
</script>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('✅ ProteinGo 服務註冊成功！', reg))
                .catch(err => console.log('❌ 服務註冊失敗！', err));
        });
    }
</script>
